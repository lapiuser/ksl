services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ksl
      POSTGRES_USER: ksl
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksl -d ksl"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://ksl:change-me@db:5432/ksl
      HOST: 0.0.0.0
      PORT: 8000
      SECRET_KEY: replace-this-on-server
      COOKIE_SECURE: "false"
      DEMO_ACTIVITY_ENABLED: "false"
      CLICK_LIMIT_PER_MINUTE: "800"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
